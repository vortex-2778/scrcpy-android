name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download scrcpy server (v5.0.1)
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -o app/src/main/assets/scrcpy-server.jar \
            https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-server-v5.0.1
          ls -l app/src/main/assets/
          sha256sum app/src/main/assets/scrcpy-server.jar

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
            -alias scrcpyandroid -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=scrcpy-android,O=scrcpy-android,L=Internet,C=XX"

      - name: Build APKs
        env:
          SCRCAPY_KEYSTORE: release.jks
          SCRCAPY_KEYSTORE_PASS: android
          SCRCAPY_KEY_ALIAS: scrcpyandroid
          SCRCAPY_KEY_PASS: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Collect APK paths
        run: |
          find . -path "*build/outputs/apk*" -name "*.apk" | tee apk_paths.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## Build result" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -l app/build/outputs/apk/debug app/build/outputs/apk/release >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
